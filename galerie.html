<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galerie Photos · The Krakens – Concerts & Backstage</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep: #0a0a0f; --bg-mid: #111118; --bg-card: #16161f;
      --border: #1e1e2e; --green-bright: #c9f0a0; --green-mid: #5ac83c;
      --text-primary: #e8e4dc; --text-secondary: #8a8a9a; --text-muted: #4a4a5a;
    }
    body { background: var(--bg-deep); color: var(--text-primary); font-family: 'Barlow', sans-serif; min-height: 100vh; }
    .page-header { background: var(--bg-mid); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    .nav-back { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); text-decoration: none; border: 1px solid var(--border); padding: 7px 14px; border-radius: 2px; transition: all 0.2s; }
    .nav-back:hover { color: var(--green-bright); border-color: var(--green-mid); }
    .page-title { font-family: 'Black Han Sans', sans-serif; font-size: 18px; color: var(--green-bright); letter-spacing: 3px; flex: 1; }
    .gallery-hero { background: var(--bg-mid); border-bottom: 1px solid var(--border); padding: 36px 32px 28px; text-align: center; }
    .gallery-hero h1 { font-family: 'Black Han Sans', sans-serif; font-size: 40px; color: var(--green-bright); letter-spacing: 6px; text-shadow: 0 0 30px rgba(90,200,60,0.3); }
    .gallery-hero p { font-size: 12px; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; }
    .content { padding: 28px 32px; max-width: 1200px; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .filter-btn { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); border: 1px solid var(--border); background: transparent; padding: 7px 16px; border-radius: 2px; cursor: pointer; font-family: 'Barlow', sans-serif; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { border-color: var(--green-mid); color: var(--green-bright); background: rgba(90,200,60,0.05); }
    .photo-count { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 16px; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .photo-item { position: relative; aspect-ratio: 4/3; overflow: hidden; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
    .photo-item:hover { border-color: var(--green-mid); transform: translateY(-2px); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .photo-item:hover img { transform: scale(1.04); }
    .photo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); display: flex; align-items: flex-end; padding: 12px; transition: background 0.2s; }
    .photo-item:hover .photo-overlay { background: rgba(0,0,0,0.5); }
    .photo-caption { font-size: 12px; color: var(--green-bright); letter-spacing: 1px; opacity: 0; transition: opacity 0.2s; }
    .photo-item:hover .photo-caption { opacity: 1; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1/-1; }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 13px; letter-spacing: 1px; line-height: 2; }
    /* LIGHTBOX */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 300; align-items: center; justify-content: center; flex-direction: column; }
    .lightbox.open { display: flex; }
    .lightbox-img { max-width: 90vw; max-height: 82vh; object-fit: contain; border-radius: 4px; }
    .lightbox-caption { margin-top: 12px; font-size: 12px; color: var(--text-secondary); letter-spacing: 2px; text-transform: uppercase; }
    .lightbox-close { position: absolute; top: 18px; right: 22px; background: transparent; border: 1px solid var(--border); color: var(--text-secondary); font-size: 20px; width: 38px; height: 38px; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .lightbox-close:hover { border-color: var(--green-mid); color: var(--green-bright); }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: var(--text-secondary); font-size: 26px; width: 48px; height: 48px; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .lightbox-nav:hover { border-color: var(--green-mid); color: var(--green-bright); }
    .lightbox-prev { left: 18px; }
    .lightbox-next { right: 18px; }
    .lightbox-counter { position: absolute; bottom: 18px; font-size: 11px; color: var(--text-muted); letter-spacing: 2px; }
  </style>
</head>
<body>

<div class="page-header">
  <a class="nav-back" href="index.html">← The Krakens</a>
  <div class="page-title">📸 Galerie Photos</div>
</div>

<div class="gallery-hero">
  <h1>THE KRAKENS</h1>
  <p>Galerie · Concerts &amp; Backstage &amp; Studio</p>
</div>

<div class="content">
  <div class="filter-tabs">
    <button class="filter-btn active" onclick="filterPhotos('all',this)">Toutes</button>
    <button class="filter-btn" onclick="filterPhotos('concert',this)">Concerts</button>
    <button class="filter-btn" onclick="filterPhotos('backstage',this)">Backstage</button>
    <button class="filter-btn" onclick="filterPhotos('studio',this)">Studio</button>
  </div>
  <div class="photo-count" id="photo-count"></div>
  <div class="photo-grid" id="photo-grid"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightboxOutside(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="navigatePhoto(-1)">‹</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt=""/>
  <div class="lightbox-caption" id="lightbox-caption"></div>
  <button class="lightbox-nav lightbox-next" onclick="navigatePhoto(1)">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script>

// ╔══════════════════════════════════════════════════════════╗
// ║  AJOUTE TES PHOTOS ICI — très simple !                   ║
// ║                                                          ║
// ║  1. Upload ta photo dans le dossier "photos/" sur GitHub ║
// ║  2. Ajoute une ligne ci-dessous :                        ║
// ║     ['photos/nom_fichier.jpg', 'concert'],               ║
// ║     ['photos/nom_fichier.jpg', 'backstage'],             ║
// ║     ['photos/nom_fichier.jpg', 'studio'],                ║
// ║                                                          ║
// ║  C'est tout ! Pas besoin de caption ni d'autre chose.    ║
// ╚══════════════════════════════════════════════════════════╝

const PHOTOS = [
  // Photos existantes
  ['images/krakens.jpg', 'concert'],
  ['images/glyn.jpg',    'concert'],
  ['images/phil.jpg',    'concert'],
  ['images/bob.jpg',     'concert'],
  ['images/ned.jpg',     'concert'],
  ['photos/ned-phil.jpg',   'concert'],
  ['photos/Krakens1.jpg',   'concert'],
  ['photos/bob-glyn.jpg',   'concert'],
  ['photos/bob2.jpg',   'concert'],
  ['photos/Glyn-Phil.jpeg',  'backstage'],
  ['photos/Ned-Glyn.jpeg',  'backstage'],
  
  // ── AJOUTE TES NOUVELLES PHOTOS ICI ──
  // ['photos/concert1.jpg',   'concert'],
  // ['photos/concert2.jpg',   'concert'],
  // ['photos/backstage1.jpg', 'backstage'],
  // ['photos/studio1.jpg',    'studio'],
];

// ── Le reste du code — ne pas modifier ──
let currentFilter = 'all';
let currentIndex = 0;
let filtered = [];

function caption(src) {
  const f = src.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
  return f.charAt(0).toUpperCase() + f.slice(1);
}

function renderGrid(filter) {
  currentFilter = filter;
  filtered = filter === 'all' ? PHOTOS : PHOTOS.filter(p => p[1] === filter);
  const grid = document.getElementById('photo-grid');
  const count = document.getElementById('photo-count');
  grid.innerHTML = '';
  count.textContent = filtered.length > 0 ? filtered.length + ' photo' + (filtered.length > 1 ? 's' : '') : '';

  if (filtered.length === 0) {
    grid.innerHTML = '';
    return;
  }

  filtered.forEach(([src], i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.innerHTML = `<img src="${src}" alt="${caption(src)}" loading="lazy"/><div class="photo-overlay"><span class="photo-caption">${caption(src)}</span></div>`;
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });
}

function filterPhotos(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid(filter);
}

function openLightbox(i) {
  currentIndex = i;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateLightbox() {
  const [src] = filtered[currentIndex];
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = caption(src);
  document.getElementById('lightbox-counter').textContent = (currentIndex+1) + ' / ' + filtered.length;
}

function navigatePhoto(dir) {
  currentIndex = (currentIndex + dir + filtered.length) % filtered.length;
  updateLightbox();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function closeLightboxOutside(e) {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'ArrowRight') navigatePhoto(1);
  if (e.key === 'ArrowLeft')  navigatePhoto(-1);
});

renderGrid('all');
</script>
</body>
</html>
